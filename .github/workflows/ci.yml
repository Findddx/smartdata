name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-pinned Temurin 25.0.4.1+1
        uses: ./.github/actions/setup-pinned-java
      - name: Test JVM modules and generate aggregate CycloneDX SBOM
        run: ./gradlew --no-daemon --no-parallel --max-workers=2 --stacktrace test cyclonedxBom --write-locks
      - name: Require executed JVM cases without skips
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree

          reports = sorted(Path(".").glob("*/build/test-results/test/TEST-*.xml"))
          if not reports:
              raise SystemExit("JVM JUnit reports are required")
          totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          for path in reports:
              suite = ElementTree.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, "0"))
          if totals["tests"] == 0 or any(totals[key] for key in ("failures", "errors", "skipped")):
              raise SystemExit(f"JVM checks must execute without failures or skips: {totals}")
          print("JVM_JUNIT_TOTALS=" + json.dumps(totals, sort_keys=True))
          PY
      - name: Reject stale dependency locks
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- settings-gradle.lockfile ':(glob)**/gradle.lockfile')"
          if [[ -n "$changes" ]]; then
            echo "Dependency lock files changed during resolution:" >&2
            echo "$changes" >&2
            exit 1
          fi
      - name: Validate CycloneDX outputs
        run: |
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path
          from xml.etree import ElementTree

          json_path = Path("build/reports/sbom/smartdata.cdx.json")
          xml_path = Path("build/reports/sbom/smartdata.cdx.xml")
          if (
              not json_path.is_file()
              or not xml_path.is_file()
              or json_path.stat().st_size == 0
              or xml_path.stat().st_size == 0
          ):
              raise SystemExit("CycloneDX JSON and XML outputs are both required")
          document = json.loads(json_path.read_text(encoding="utf-8"))
          if document.get("bomFormat") != "CycloneDX":
              raise SystemExit("unexpected SBOM format")
          if document.get("specVersion") != "1.6":
              raise SystemExit("CycloneDX 1.6 is required")
          components = document.get("components", [])
          if not components:
              raise SystemExit("aggregate SBOM contains no components")
          if any(not item.get("name") or not item.get("version") or not item.get("bom-ref") for item in components):
              raise SystemExit("every SBOM component requires name, version and bom-ref")
          component_refs = [item["bom-ref"] for item in components]
          if len(component_refs) != len(set(component_refs)):
              raise SystemExit("duplicate component bom-ref in aggregate SBOM")
          versions = tomllib.loads(Path("gradle/libs.versions.toml").read_text(encoding="utf-8"))["versions"]
          jackson_version = versions["jackson"]
          jackson3 = [item for item in components if item.get("group", "").startswith("tools.jackson")]
          if not jackson3 or any(item["version"] != jackson_version for item in jackson3):
              raise SystemExit(f"all tools.jackson modules must use {jackson_version}")
          # The official OpenAI SDK uses the separate com.fasterxml Jackson 2
          # namespace; it does not replace the application's Jackson 3 DTO codec.
          jackson2 = [item for item in components if item.get("group", "").startswith("com.fasterxml.jackson") and item.get("name") != "jackson-annotations"]
          if not jackson2 or any(item["version"] != versions["jackson2"] for item in jackson2):
              raise SystemExit(f"all Jackson 2 codecs/BOMs must use {versions['jackson2']}; shared annotations follow Jackson 3 BOM")
          tomcat = [item for item in components if item.get("group", "").startswith("org.apache.tomcat")]
          if not tomcat or any(item["version"] != versions["tomcat"] for item in tomcat):
              raise SystemExit(f"all Tomcat components must use {versions['tomcat']}")
          root_ref = document.get("metadata", {}).get("component", {}).get("bom-ref")
          known_refs = set(component_refs)
          if root_ref:
              known_refs.add(root_ref)
          graph_refs = {
              ref
              for edge in document.get("dependencies", [])
              for ref in [edge.get("ref"), *edge.get("dependsOn", [])]
              if ref
          }
          if graph_refs - known_refs:
              raise SystemExit("SBOM dependency graph contains unknown bom-ref values")
          xml_root = ElementTree.parse(xml_path).getroot()
          if not xml_root.tag.endswith("}bom"):
              raise SystemExit("unexpected CycloneDX XML root")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smartdata-cyclonedx-sbom
          path: |
            build/reports/sbom/smartdata.cdx.json
            build/reports/sbom/smartdata.cdx.xml
          if-no-files-found: error
          retention-days: 30
      - name: Preserve JVM JUnit and HTML evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: smartdata-jvm-tests
          path: |
            */build/test-results/test/TEST-*.xml
            */build/reports/tests/test
          if-no-files-found: error
          retention-days: 30

  postgresql-integration:
    name: PostgreSQL 18 migrations, isolation and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-pinned Temurin 25.0.4.1+1
        uses: ./.github/actions/setup-pinned-java
      - name: Require a real Docker engine
        run: docker info
      - name: Build the pinned PostgreSQL delivery image
        run: |
          docker build --file deploy/docker/postgres.Dockerfile \
            --tag localhost/smartdata-postgres:18.6-alpine3.24-r1 deploy/docker
          image_id="$(docker image inspect --format '{{.Id}}' localhost/smartdata-postgres:18.6-alpine3.24-r1)"
          echo "SMARTDATA_TEST_POSTGRES_IMAGE_ID=$image_id" >> "$GITHUB_ENV"
      - name: Scan the actual PostgreSQL delivery image
        run: |
          mkdir -p "$RUNNER_TEMP/postgres-image-scan"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/postgres-image-scan:/reports" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --image-src docker --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --format json --output /reports/postgresql-image.json \
            localhost/smartdata-postgres:18.6-alpine3.24-r1
      - name: Run real PostgreSQL 18 integration tests
        run: ./gradlew --no-daemon --no-parallel --max-workers=2 --stacktrace :runtime-api:integrationTest --write-locks
      - name: Reject stale integration dependency locks
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- settings-gradle.lockfile ':(glob)**/gradle.lockfile')"
          if [[ -n "$changes" ]]; then
            echo "Integration dependency lock files changed during resolution:" >&2
            echo "$changes" >&2
            exit 1
          fi
      - name: Require executed integration cases without skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          reports = list(Path("runtime-api/build/test-results/integrationTest").glob("TEST-*.xml"))
          if not reports:
              raise SystemExit("real PostgreSQL JUnit reports are required")
          totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          for path in reports:
              suite = ElementTree.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, "0"))
          output = "\n".join(ElementTree.parse(path).getroot().findtext("system-out", "") for path in reports)
          if (
              "POSTGRESQL_INTEGRATION_PROVIDER=TESTCONTAINERS_POSTGRES_18_6" not in output
              or "POSTGRESQL_INTEGRATION_DISTRIBUTION=SMARTDATA_ALPINE_3_24_R1" not in output
              or "PROVIDER=PORTABLE" in output
          ):
              raise SystemExit("CI must prove execution against the real Testcontainers provider")
          if totals["tests"] == 0 or any(totals[key] for key in ("failures", "errors", "skipped")):
              raise SystemExit(f"PostgreSQL checks must execute without failures or skips: {totals}")
          print(f"Real PostgreSQL checks passed: {totals}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: smartdata-postgresql18-integration
          path: |
            runtime-api/build/reports/tests/integrationTest
            runtime-api/build/test-results/integrationTest
          if-no-files-found: error
          retention-days: 30
      - name: Preserve PostgreSQL image scan evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: smartdata-postgresql-image-scan
          path: ${{ runner.temp }}/postgres-image-scan/postgresql-image.json
          if-no-files-found: error
          retention-days: 30

  contracts:
    name: Public contract validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.8.0"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Validate OpenAPI and event JSON Schema
        run: |
          npm ci --ignore-scripts
          npm run validate
          npm audit --audit-level=high
      - name: Download verified protoc 35.0
        shell: bash
        run: |
          archive="$RUNNER_TEMP/protoc-35.0-linux-x86_64.zip"
          curl --fail --location --silent --show-error --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/protocolbuffers/protobuf/releases/download/v35.0/protoc-35.0-linux-x86_64.zip
          echo "a45cda0989c17dd950db55f6fbe1e5814c50fda08e87aa422980ac1f89dddbbc  $archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/protoc-35.0"
      - name: Compile connector protocol to descriptor set
        shell: bash
        run: |
          "$RUNNER_TEMP/protoc-35.0/bin/protoc" \
            --proto_path=connector \
            --include_imports \
            --descriptor_set_out="$RUNNER_TEMP/smartdata-connector-v1.pb" \
            connector/v1/connector.proto
          test -s "$RUNNER_TEMP/smartdata-connector-v1.pb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smartdata-connector-v1-descriptor
          path: ${{ runner.temp }}/smartdata-connector-v1.pb
          if-no-files-found: error
          retention-days: 30

  console:
    name: Console test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.8.0"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  workspace-http-smoke:
    name: Workspace HTTP contracts and collaboration smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SMARTDATA_WORKSPACE_SMOKE_URL: http://127.0.0.1:18080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-pinned Temurin 25.0.4.1+1
        uses: ./.github/actions/setup-pinned-java
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.8.0"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Build runtime and install locked contract validators
        run: |
          ./gradlew --no-daemon --no-parallel --max-workers=2 :runtime-api:bootJar
          npm ci --prefix contracts --ignore-scripts
      - name: Exercise a disposable local workspace over HTTP
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find runtime-api/build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$jar_path"
          workspace_dir="$(mktemp -d "$RUNNER_TEMP/smartdata-workspace-smoke.XXXXXX")"
          runtime_log="$RUNNER_TEMP/smartdata-workspace-smoke.log"
          start_runtime() {
            java -Xmx512m -jar "$jar_path" \
              --spring.profiles.active=local \
              --server.address=127.0.0.1 \
              --server.port=18080 \
              --smartdata.workspace.storage-dir="$workspace_dir" \
              --smartdata.workspace.reasoning.mode=RULES \
              >> "$runtime_log" 2>&1 &
            runtime_pid=$!
          }
          await_ready() {
            local ready=false
            for attempt in {1..60}; do
              if curl --fail --silent --max-time 2 http://127.0.0.1:18080/actuator/health/readiness > /dev/null; then
                ready=true
                break
              fi
              if ! kill -0 "$runtime_pid" 2>/dev/null; then
                cat "$runtime_log"
                return 1
              fi
              sleep 1
            done
            if [[ "$ready" != true ]]; then
              cat "$runtime_log"
              return 1
            fi
          }
          start_runtime
          trap 'kill "$runtime_pid" 2>/dev/null || true; wait "$runtime_pid" 2>/dev/null || true' EXIT
          await_ready
          npm run smoke:workspace --prefix contracts
          kill "$runtime_pid"
          wait "$runtime_pid" || true
          start_runtime
          await_ready
          npm run smoke:workspace --prefix contracts -- --verify-restored

  mcp-bridge:
    name: MCP bridge test, race and vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp-bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: mcp-bridge/go.sum
      - name: Enforce formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Check reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  deployment:
    name: Deployment and policy validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SMARTDATA_DEMO_DB_PASSWORD: 0123456789abcdef0123456789abcdef
      SMARTDATA_DEMO_QDRANT_API_KEY: 0123456789abcdef0123456789abcdef
      SMARTDATA_DEMO_OPENFGA_KEY: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Lint and render Helm chart
        run: |
          helm lint deploy/helm/smartdata --strict
          helm template ci-default deploy/helm/smartdata > "$RUNNER_TEMP/smartdata-default.yaml"
          helm template ci-all deploy/helm/smartdata --set mcpBridge.enabled=true --set workflowWorker.enabled=true --set workflowWorker.temporal.enabled=true > "$RUNNER_TEMP/smartdata-all.yaml"
          test "$(grep -c 'name: SPRING_PROFILES_ACTIVE' "$RUNNER_TEMP/smartdata-all.yaml")" -eq 2
          test "$(grep -c 'value: \"production\"' "$RUNNER_TEMP/smartdata-all.yaml")" -ge 2
          if helm template ci-invalid deploy/helm/smartdata \
            --set workflowWorker.enabled=true \
            --set runtimeApi.existingSecret=shared-secret \
            --set workflowWorker.existingSecret=shared-secret; then
            echo "chart accepted a shared Runtime/Worker secret" >&2
            exit 1
          fi
      - name: Validate local demo Compose
        run: docker compose --profile apps --profile observability -f deploy/compose/compose.demo.yaml config --quiet
      - name: Test fail-closed OPA policy
        run: docker run --rm -v "$PWD/deploy/policy/smartdata:/policy:ro" openpolicyagent/opa:1.20.2-static test /policy

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0

  repository-security:
    name: Secret and repository scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan committed history for secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/reports" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --gitleaks-ignore-path=/repo/.github/gitleaks-baseline.ignore \
            --redact --verbose --no-banner --no-color \
            --report-format=json --report-path=/reports/gitleaks.json
      - name: Preserve redacted secret scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smartdata-gitleaks-redacted
          path: ${{ runner.temp }}/gitleaks.json
          if-no-files-found: warn
          retention-days: 7
      - name: Scan dependencies and configuration
        # Build tools can affect shipped assets; include npm/Gradle development dependencies too.
        run: docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:0.74.0 fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --include-dev-deps --ignore-unfixed --ignore-policy /repo/.github/trivy-demo-flags.rego --exit-code 1 /repo
      - name: Ensure the demo flag exception still rejects secret instructions
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-policy-fixture"
          cat > "$RUNNER_TEMP/trivy-policy-fixture/Dockerfile" <<'DOCKERFILE'
          FROM alpine:3.22
          ARG VITE_DEMO_AUTH=fixture
          ENV VITE_DEMO_AUTH=${VITE_DEMO_AUTH}
          ARG OTHER_API_TOKEN=fixture
          DOCKERFILE
          set +e
          docker run --rm -v "$RUNNER_TEMP/trivy-policy-fixture:/fixture:ro" -v "$PWD/.github:/policy:ro" \
            aquasec/trivy:0.74.0 fs --scanners misconfig --severity HIGH,CRITICAL \
            --ignore-policy /policy/trivy-demo-flags.rego --exit-code 1 --format json /fixture \
            > "$RUNNER_TEMP/trivy-policy-negative.json"
          scan_status=$?
          set -e
          test "$scan_status" -eq 1
          python3 - "$RUNNER_TEMP/trivy-policy-negative.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          messages = {
              finding["Message"]
              for result in report.get("Results", [])
              for finding in result.get("Misconfigurations", [])
              if finding["ID"] == "DS-0031"
          }
          expected = {
              'Possible exposure of secret env "VITE_DEMO_AUTH" in ARG',
              'Possible exposure of secret env "OTHER_API_TOKEN" in ARG',
          }
          if not expected.issubset(messages):
              raise SystemExit("demo exception suppressed a new secret instruction")
          PY

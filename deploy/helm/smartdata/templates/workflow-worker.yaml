{{- if and .Values.workflowWorker.enabled .Values.workflowWorker.temporal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smartdata.fullname" . }}-workflow-worker
  labels:
    {{- include "smartdata.labels" . | nindent 4 }}
    app.kubernetes.io/component: workflow-worker
spec:
  replicas: {{ .Values.workflowWorker.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "smartdata.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: workflow-worker
  template:
    metadata:
      labels:
        {{- include "smartdata.labels" . | nindent 8 }}
        app.kubernetes.io/component: workflow-worker
    spec:
      serviceAccountName: {{ include "smartdata.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: workflow-worker
          image: "{{ .Values.workflowWorker.image.repository }}{{ if .Values.workflowWorker.image.digest }}@{{ .Values.workflowWorker.image.digest }}{{ else }}:{{ .Values.workflowWorker.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.workflowWorker.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            # A cluster worker must never load the deterministic local facade.
            - {name: SPRING_PROFILES_ACTIVE, value: "production"}
          envFrom:
            - configMapRef: {name: {{ include "smartdata.fullname" . }}-config}
            - secretRef: {name: {{ required "workflowWorker.existingSecret is required" .Values.workflowWorker.existingSecret }}}
          resources:
            {{- toYaml .Values.workflowWorker.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

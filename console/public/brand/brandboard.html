<main><header><svg class="mark" aria-label="SmartData 标识"><use href="#mark"/></svg><div><small>SMARTDATA / IDENTITY STUDY</small><h1>SmartData</h1><p>折层与通道：保留各自来源，形成可共同理解的路径。原创 SVG 草案，等待实际产品中的用户验收。</p></div></header>
<div class="spec"><section><h2>同一个标识，适应不同尺度</h2><div class="sizes"><svg width="16" height="16"><use href="#mark"/></svg><svg width="24" height="24"><use href="#mark"/></svg><svg width="32" height="32"><use href="#mark"/></svg><svg width="56" height="56"><use href="#mark"/></svg></div></section><section><h2>产品表面保持安静</h2><div class="swatches"><span><i style="--c:#f7f6f2;outline:1px solid #ddd"></i>纸灰白</span><span><i style="--c:#252c30"></i>墨色</span><span><i style="--c:#31556a"></i>普鲁士蓝</span><span><i style="--c:#ad6156"></i>朱红</span></div></section></div>

<div class="quiet"><svg aria-label="SmartData 深色标识"><use href="#mark"/></svg><strong>SmartData</strong></div><p>权限、敏感程度、新鲜度与风险独立标注，不借用数据层级的颜色。图谱不靠颜色单独传达信息。</p><footer>设计研究页 · 此页不包含业务数据 · SVG 由本项目编写，未使用 Claude 花形标识。</footer></main></body></html>
